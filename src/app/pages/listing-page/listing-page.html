@if (loading) {
  <loading/>
}

@if (listing) {
  <div class="grid grid-cols-12 gap-5">
    <image-slider
      class="col-span-full md:col-span-8"
      [imageUrls]="imageUrls"
    />

    <listing-info-section
      class="col-span-full md:col-span-4"
      [listing]="listing"
    />

    <listing-description-section
      class="col-span-full md:col-span-8"
      [listing]="listing"
    />
  </div>
}

@if (errorOccurred) {
  <vertical-spacing gap="5" items="center">
    <svg-icon
      src="db-off.svg"
      class="inline-flex size-40 text-red-300"
    />

    <p class="text-red-950">There was a problem with the server. Please try again later</p>
  </vertical-spacing>
}
