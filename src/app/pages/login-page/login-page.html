<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 relative overflow-hidden">

  <!-- decorative blobs -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-300/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-300/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/2 left-1/4 w-64 h-64 bg-sky-200/20 rounded-full blur-2xl pointer-events-none"></div>

  <div class="flex flex-col items-center gap-4 w-full max-w-[400px] relative z-10">
    <logo size="lg"/>
    <div class="bg-white/80 backdrop-blur-sm rounded-3xl p-6 w-full shadow-xl shadow-blue-200/40 border border-blue-100/60">
      <login-form (goToRegister)="goToRegister()" />
    </div>
  </div>
</div>
