<div class="p-5 relative">
  @if (errorOccurred) {
    <div class="mb-6">
      <alert
        #alert
        variant="Error"
      >
        <p>Failed to create listing. There was a problem with the server. Please try again later</p>
      </alert>
    </div>
  }

  @if (loading) {
    <loading/>
  }

  <vertical-spacing gap="6">
    <listing-form/>

    <horizontal-spacing justify="end">
      <app-button
        [disabled]="isFormInValid"
        (click)="createListing()"
        label="Create Listing"
      />
    </horizontal-spacing>
  </vertical-spacing>
</div>
