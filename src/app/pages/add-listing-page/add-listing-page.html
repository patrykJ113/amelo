<vertical-spacing gap="6">
  <listing-form/>

  <alert
    type="ERROR"
    [message]="errorMessage"
    [show]="showError"
  />

  <horizontal-spacing justify="end">
    <add-listing-button
      [loading]="loading"
      [disabled]="isFormInValid"
      (click)="createListing()"
    />
  </horizontal-spacing>
</vertical-spacing>
