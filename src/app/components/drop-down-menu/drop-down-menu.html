@if (isOpen) {
  <div
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    animate.enter="enter-animation"
    animate.leave="leave-animation"
    class="absolute top-[calc(100%+10px)] right-0 border border-gray-300 rounded-lg bg-white px-2 min-w-64 focus:outline-none"
    [tabIndex]="panelTabIndex"
    [ngClass]="{'pointer-events-none': !open}"
    (keydown.esc)="onEscKeyDown()"
    (click)="close()"
    (focusin)="onFocusIn()"
    (keydown.enter)="close()"
    tabindex="0"
  >
    <ng-content/>
  </div>
}
