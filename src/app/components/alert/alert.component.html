<div
  class="border-l-4 p-4"
  [ngClass]="{
    'border-red-400 bg-red-50': isError(),
    'border-blue-400 bg-blue-50': isInfo(),
    'border-yellow-400 bg-yellow-50': isWarning(),
    'border-green-400 bg-green-50': isSuccess()
  }"
>
  <div class="flex">
    <div class="shrink-0">
      <svg-icon
        class="inline-flex size-5"
        [src]="svgUrl"
        [ngClass]="{
          'text-red-400': isError(),
          'text-blue-400': isInfo(),
          'text-yellow-400': isWarning(),
          'text-green-400': isSuccess()
        }"
      />
    </div>

    <div class="ml-3">
      <p
        class="text-sm"
        [ngClass]="{
          'text-red-700': isError(),
          'text-blue-700': isInfo(),
          'text-yellow-700': isWarning(),
          'text-green-700': isSuccess()
        }"
      >
        {{ text }}
        <ng-content></ng-content>
      </p>
    </div>
  </div>
</div>
