@if (isShown()) {
  <div
    class="border-l-4 p-4 rounded-md"
    [ngClass]="{
            'border-red-400 bg-red-50': isError,
            'border-green-400 bg-green-50': isSuccess,
        }"
  >
    <div class="flex justify-between gap-4">
      <div class="flex">
        <div class="shrink-0">
          <svg-icon
            [src]="svgSrc"
            class="inline-flex size-5"
            [ngClass]="{
                            'text-red-400': isError,
                            'text-green-400': isSuccess,
                        }"
          />
        </div>

        <div class="ml-3">
          <p
            class="text-sm"
            [ngClass]="{
                            'text-red-700': isError,
                            'text-green-700': isSuccess,
                        }"
          >
            {{ message }}
          </p>
        </div>
      </div>

      <div
        tabindex="0"
        class="p-2 w-fit h-fit rounded-md transition-all duration-150
                cursor-pointer flex justify-center items-start group outline-none"
        [ngClass]="{
                'hover:bg-red-100 focus-visible:bg-red-100': isError,
                'hover:bg-green-100 focus-visible:bg-green-100': isSuccess,
             }"
        (keydown.enter)="close()"
      >
        <svg-icon
          src="x-mark.svg"
          class="inline-flex justify-center items-center size-4
                       group-hover:scale-125 group-focus-visible:scale-125  transition-all duration-150"
          [ngClass]="{
                        'text-red-700': isError,
                        'text-green-700': isSuccess,
                    }"
          (click)="close()"
        />
      </div>
    </div>
  </div>
}
