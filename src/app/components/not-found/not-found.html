<div class="flex flex-col items-center justify-center min-h-[60vh] text-center px-4 select-none">

  <div class="absolute -z-10 w-96 h-96 bg-blue-200/30 rounded-full blur-3xl pointer-events-none -translate-y-20"></div>
  <div class="absolute -z-10 w-64 h-64 bg-indigo-200/20 rounded-full blur-2xl pointer-events-none translate-x-32 translate-y-16"></div>

  <svg-icon src="ghost.svg" class="inline-flex w-44 h-44 sm:w-56 sm:h-56 mb-4"/>

  <p class="text-2xl font-semibold text-blue-500 tracking-widest uppercase mb-2">404</p>

  <h1 class="text-4xl sm:text-5xl md:text-6xl font-black text-gray-900 mb-3">
    Page not found
  </h1>

  <p class="text-gray-400 max-w-sm mb-10 leading-relaxed">
    Sorry, we couldn't find the page you're looking for. It may have been moved or deleted.
  </p>

  <button
    routerLink="/"
    class="inline-flex items-center gap-2 rounded-full transition-all duration-200 outline-none border-2 text-sm font-medium
           cursor-pointer focus-visible:ring-4 focus-visible:ring-blue-500/30
           border-blue-500 bg-blue-500 text-white hover:bg-blue-400 hover:border-blue-400 active:bg-blue-700 active:border-blue-700
           px-5 py-2 group"
  >
    <svg-icon src="arrow-left.svg" class="inline-flex size-4 transition-transform duration-200 group-hover:-translate-x-1"/>
    <span class="block transition-all duration-200 group-hover:scale-105">Back to home</span>
  </button>
</div>
