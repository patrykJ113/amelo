<li
  tabindex="0"
  class="p-3 hover:bg-blue-100/50 hover:text-blue-950 rounded-md border border-transparent
        text-gray-700 cursor-pointer transition-all hover:border-gray-200 group"
>
  <div class="group-hover:translate-x-2 transition-all duration-200">
    <horizontal-spacing gap="2" items="start">
      <svg-icon
        [src]="src"
        class="inline-flex size-6"
      />
      {{ text }}
    </horizontal-spacing>
  </div>
</li>
