<div class="fixed z-10 inset-0 h-screen w-screen bg-gray-900/40 flex items-center justify-center
            backdrop-blur-xs transition-opacity duration-300 opacity-0"
     (click)="close()"
     [ngClass]="open ? 'opacity-100' : 'pointer-events-none'"
>
  <div
    class="w-full grid mx-4 gap-4 grid-cols-4 sm:grid-cols-8 sm:mx-8 md:grid-cols-12 md:mx-6 md:gap-6 xl:mx-[200px]">
    <div
      class="bg-white rounded-2xl col-span-full md:col-start-3 md:col-span-8 lg:col-start-4 lg:col-span-6
              xl:col-start-4 xl:col-span-6 2xl:col-start-5 2xl:col-span-4 p-5 transition-all duration-300 ease-out"
      [ngClass]="open ? 'scale-100' : 'scale-90'"
      (click)="$event.stopPropagation()"
    >
      @if (open) {
        <div
          cdkTrapFocus
          cdkTrapFocusAutoCapture
        >
          <vertical-spacing gap="8">
            <horizontal-spacing justify="between">
              <h1 class="text-3xl">{{ title }}</h1>

              @if (!title) {
                <ng-content select="[title]"/>
              }

              @if (hasCloseIcon) {
                <svg-icon
                  tabindex="0"
                  src="x.svg"
                  class="inline-flex size-7 cursor-pointer hover:scale-125 text-gray-400/80 hover:text-gray-800 transition-all duration-200
                     focus:outline-none focus:text-gray-800 focus:scale-125"
                  (click)="close()"
                />
              }
            </horizontal-spacing>

            <vertical-spacing gap="14">
              <ng-content/>

              <vertical-spacing
                items="end"
              >
                <horizontal-spacing gap="4">
                  @if (hasCancelButton) {
                    <app-button
                      label="Cancel"
                      (click)="close()"
                    />
                  }

                  <ng-content
                    select="[submit-btn]"
                  />
                </horizontal-spacing>
              </vertical-spacing>
            </vertical-spacing>
          </vertical-spacing>
        </div>
      }
    </div>
  </div>
</div>
