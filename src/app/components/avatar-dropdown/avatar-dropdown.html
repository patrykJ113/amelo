<div
  class="relative"
  #dropdown
>
  <div
    tabindex="0"
    class="p-4 rounded-full bg-blue-300 size-10 flex justify-center items-center cursor-pointer text-blue-900 focus:outline-0 transition-all duration-150
           relative z-10 focus-visible:scale-105 focus-visible:ring-[6px] focus-visible:ring-blue-500/20 focus-visible:bg-blue-400 focus-visible:text-gray-200
           hover:scale-105 hover:ring-[6px] hover:ring-blue-500/20 hover:bg-blue-400 hover:text-gray-200"
    (click)="toggleDropdown()"
    (keydown.enter)="openDropdown()"
  >
    {{ initials }}
  </div>

  <drop-down-menu [open]="open">
    <drop-down-sub-menu [divider]="false">
      <menu-item
        svgSrc="user"
        text="Profile"
      />

      <menu-item
        svgSrc="chat-bubble"
        text="Messages"
      />

      <menu-item
        svgSrc="bell"
        text="Notifications"
      />
    </drop-down-sub-menu>

    <drop-down-sub-menu>
      <menu-item
        svgSrc="moon"
        text="Dark Mode"
      />

      <menu-item
        svgSrc="gear-wheel"
        text="Setings"
        url="account-settings"
      />
    </drop-down-sub-menu>

    <drop-down-sub-menu>
      <menu-item
        svgSrc="arrow-right-start-on-rectangle"
        text="Log out"
        [onSelectItemCallBack]="logOut"
      />
    </drop-down-sub-menu>
  </drop-down-menu>
</div>
