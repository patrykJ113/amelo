<button
  class="px-6 py-3 rounded-lg transition-all duration-200 outline-none  border-2 font-medium group"
  [ngClass]="{
    'focus-visible:ring-4 focus-visible:ring-blue-500/30': showRingOnFocusVisible,
    'cursor-pointer': hasCursorPointer,
    'text-blue-500 active:bg-blue-200': blueTextAndBlueBgOnActive,
    'border-transparent': hasTransparentBorder || isDisabledText,
    'border-blue-500 bg-blue-500 text-white hover:bg-blue-400 hover:border-blue-400 active:bg-blue-700 active:border-blue-700': isPrimary,
    'active:bg-blue-100/80': isOutline,
    'hover:border-blue-100 active:border-blue-200 hover:bg-blue-100 focus-visible:bg-blue-100': isText,
    'cursor-not-allowed text-gray-400 border-gray-200': disabled,
    'bg-gray-200': isDisabledPrimary,
  }"
  [disabled]="disabled"
  [type]="type"
  [class]="class"
>
  <span
    class="block transition-all duration-200"
    [ngClass]="{
      'group-hover:scale-110 group-focus-visible:scale-110': scaleTextOnHover
    }"
  >
    {{ label }}
  </span>
</button>
