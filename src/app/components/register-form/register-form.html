<vertical-spacing gap="1" items="center">
  <h1 class="text-3xl leading-8 font-medium">
    Create Account
  </h1>

  <p class="leading-5 text-gray-400">
    Register with your social account
  </p>
</vertical-spacing>

<div class="mt-7">
  <oauth-button-group/>
</div>


<div class="mt-14 mb-4">
  <divider-with-text
    text="Or with you’re email"
  />
</div>

<vertical-spacing gap="5">
  <app-input
    label="E-mail"
    type="email"
    cdkFocusInitial
    [control]="control"
  />

  <app-input
    label="Password"
    type="password"
    [control]="control"
  />
</vertical-spacing>

<div class="mt-12">
  <vertical-spacing gap="3" items="center">
    <app-button
      label="Register"
      class="w-full"
    />

    <div class="text-gray-500">
      Have an account ?
      <reveal-underline text="Sign In"/>
    </div>
  </vertical-spacing>
</div>
