@if (registrationSuccess) {
  <div class="flex flex-col items-center text-center pt-6 pb-4">
    <div class="relative mb-5 flex items-center justify-center">
      <div class="absolute size-20 rounded-full bg-emerald-400/20 animate-ping"></div>
      <div class="absolute size-20 bg-emerald-300/25 rounded-full blur-xl"></div>
      <div class="absolute -top-1 -right-1 size-2.5 rounded-full bg-emerald-400/60"></div>
      <div class="absolute -bottom-1 -left-1 size-2 rounded-full bg-emerald-300/80"></div>
      <div class="absolute top-1 -left-3 size-1.5 rounded-full bg-emerald-400/50"></div>
      <div class="relative bg-emerald-50 rounded-full p-5 border border-emerald-100">
        <svg-icon
          src="success.svg"
          class="inline-flex size-10 text-emerald-500"
        />
      </div>
    </div>

    <h1 class="text-2xl font-medium text-gray-800">
      You're all set!
    </h1>

    <p class="text-sm text-gray-400 mt-1.5">
      Your account has been created successfully.
    </p>

    <div class="w-full h-px bg-gray-100 my-5"></div>

    <p class="text-sm text-gray-500 mb-4">Ready to get started?</p>

    <app-button
      label="Sign In"
      class="w-full"
      (click)="onSignInEnterKeyDow()"
    />
  </div>
} @else {
  <div class="relative">
    @if (loading) {
      <div class="absolute inset-0 bg-white/40 flex justify-center items-center z-10">
        <spinner/>
      </div>
    }

    <vertical-spacing gap="1" items="center">
      <h1 class="text-2xl font-medium">
        Create Account
      </h1>
      <p class="text-sm text-gray-400">
        Register with your social account
      </p>
    </vertical-spacing>

    <div class="mt-4">
      <oauth-button-group/>
    </div>

    <div class="mt-4">
      <vertical-spacing gap="3">
        <alert
          [message]="errorMessage"
          type="ERROR"
          [show]="showError"
        />
        <divider-with-text
          text="Or with you're email"
        />
      </vertical-spacing>
    </div>

    <div class="mt-4">
      <vertical-spacing gap="4">
        <app-input
          label="E-mail"
          type="email"
          cdkFocusInitial
          svgFileName="at-symbol"
          [control]="getControl('email')"
        />
        <app-input
          label="Password"
          [svgFileName]="passwordSvgFileName"
          [type]="passwordInputType"
          [svgCb]="showPassword"
          [control]="getControl('password')"
        />
        <password-hints
          [password]="getControl('password').value"
          [firstSubmit]="firstSubmit"
        />
      </vertical-spacing>
    </div>

    <div class="mt-5">
      <vertical-spacing gap="3" items="center">
        <app-button
          label="Sign Up"
          class="w-full"
          (click)="register()"
        />
        <div class="text-sm text-gray-500">
          <span class="mr-1.5">Have an account ?</span>
          <reveal-underline
            text="Sign In"
            (keydown.enter)="onSignInEnterKeyDow()"
            (click)="onSignInEnterKeyDow()"
          />
        </div>
      </vertical-spacing>
    </div>
  </div>
}
