<div class="flex items-center gap-1.5">
  <svg-icon
    [src]="src"
    class="inline-flex size-5 items-center"
    [ngClass]="{
      'text-gray-400/60': !firstSubmit || meetsRequirement,
      'text-red-400': !meetsRequirement && firstSubmit,
      '!text-emerald-500': meetsRequirement
    }"
  />

  <p
    class="text-sm text-gray-400/80"
    [ngClass]="{'line-through': meetsRequirement}"
  >
    {{ hint }}
  </p>
</div>
