<div class="flex items-center gap-1.5">
  <svg-icon
    [src]="src"
    class="inline-flex size-5 items-center"
    [ngClass]="{
      'text-gray-400/60': !firstSubmit || meetsRequirement,
      'text-red-400': !meetsRequirement && firstSubmit,
      '!text-emerald-500': meetsRequirement
    }"
  />

  <span class="relative text-sm text-gray-400/80">
    {{ hint }}
    <span
      class="absolute left-0 top-1/2 h-px bg-gray-400/80 transition-all duration-300 ease-in-out"
      [class.w-full]="meetsRequirement"
      [class.w-0]="!meetsRequirement"
    ></span>
  </span>

  <ng-content/>
</div>
